<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🎣 낚시 게임</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,"Malgun Gothic",sans-serif;
    background:#071b2e;
    color:white;
}

button{
    font-family:inherit;
    cursor:pointer;
    border:0;
}

.screen{
    position:absolute;
    inset:0;
    display:none;
}

.screen.active{
    display:block;
}

/* ================================
   서버 선택
================================ */

#serverScreen{
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
        radial-gradient(circle at 50% 30%,#1688c7,#0a3b60 48%,#03111e);
}

#serverScreen.active{
    display:flex;
}

.serverBox{
    width:min(92vw,650px);
    padding:35px 25px;
    border-radius:25px;
    background:rgba(0,0,0,.42);
    border:2px solid rgba(255,255,255,.15);
    box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.serverTitle{
    font-size:clamp(40px,8vw,70px);
    font-weight:900;
    margin-bottom:10px;
}

.serverSub{
    opacity:.8;
    margin-bottom:30px;
}

.serverButtons{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
}

.serverBtn{
    width:230px;
    padding:25px 15px;
    border-radius:20px;
    color:white;
    font-size:24px;
    font-weight:900;
}

.serverBtn:hover{
    transform:translateY(-3px);
}

.privateBtn{
    background:linear-gradient(135deg,#287cff,#1643b9);
}

.publicBtn{
    background:linear-gradient(135deg,#18c985,#07845f);
}

.serverInfo{
    margin-top:22px;
    line-height:1.7;
    font-size:14px;
    opacity:.75;
}

/* ================================
   닉네임
================================ */

#nicknameScreen{
    align-items:center;
    justify-content:center;
    text-align:center;
    background:linear-gradient(#0a3e62,#031522);
}

#nicknameScreen.active{
    display:flex;
}

.nicknameBox{
    width:min(90vw,500px);
    padding:30px;
    background:rgba(0,0,0,.4);
    border-radius:22px;
}

.nicknameBox h2{
    font-size:35px;
}

.nicknameInput{
    width:100%;
    padding:17px;
    border-radius:12px;
    border:0;
    outline:0;
    font-size:20px;
    text-align:center;
    margin:15px 0;
}

.startPublic{
    width:100%;
    padding:16px;
    border-radius:12px;
    background:#19c983;
    color:white;
    font-size:21px;
    font-weight:bold;
}

/* ================================
   게임
================================ */

#gameScreen{
    background:
        linear-gradient(
            to bottom,
            #63c8ff 0%,
            #a8e6ff 34%,
            #55b9df 35%,
            #197baa 60%,
            #06466e 100%
        );
}

.water{
    position:absolute;
    left:0;
    right:0;
    top:35%;
    bottom:0;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.07) 0px,
            rgba(255,255,255,.07) 3px,
            transparent 3px,
            transparent 28px
        );
}

.cloud{
    position:absolute;
    width:160px;
    height:55px;
    background:rgba(255,255,255,.75);
    border-radius:60px;
    opacity:.7;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud:before{
    width:70px;
    height:70px;
    left:25px;
    top:-30px;
}

.cloud:after{
    width:85px;
    height:85px;
    right:20px;
    top:-45px;
}

.cloud1{
    position:absolute;
    left:5%;
    top:12%;
}

.cloud2{
    position:absolute;
    right:8%;
    top:20%;
    transform:scale(.7);
}

.cloud3{
    position:absolute;
    left:45%;
    top:8%;
    transform:scale(.55);
}

.dock{
    position:absolute;
    left:0;
    top:35%;
    bottom:0;
    width:38%;
    min-width:240px;
    background:
        repeating-linear-gradient(
            90deg,
            #754526 0px,
            #754526 70px,
            #63391e 70px,
            #63391e 75px
        );
    box-shadow:inset -15px 0 30px rgba(0,0,0,.3);
}

.dock:after{
    content:"";
    position:absolute;
    right:-25px;
    top:0;
    width:35px;
    height:100%;
    background:#3d2819;
}

/* ================================
   내 캐릭터
================================ */

.player{
    position:absolute;
    left:18%;
    top:56%;
    width:65px;
    height:105px;
    z-index:15;
    transition:left .05s linear;
}

.playerHead{
    width:42px;
    height:42px;
    margin:auto;
    border-radius:50%;
    background:#ffd2a6;
    border:3px solid #422;
}

.playerBody{
    width:48px;
    height:55px;
    margin:3px auto;
    border-radius:13px 13px 5px 5px;
    background:#2979ff;
}

.playerLegs{
    display:flex;
    justify-content:center;
    gap:7px;
}

.playerLegs span{
    width:13px;
    height:30px;
    background:#222;
    border-radius:8px;
}

.rodVisual{
    position:absolute;
    width:125px;
    height:6px;
    background:#342315;
    transform:rotate(-20deg);
    transform-origin:left center;
    left:46px;
    top:43px;
}

.lineVisual{
    position:absolute;
    width:2px;
    height:110px;
    background:white;
    left:165px;
    top:15px;
}

/* ================================
   다른 플레이어
================================ */

.publicPlayers{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:25;
}

.onlinePlayer{
    position:absolute;
    width:65px;
    height:120px;
    transform:translateX(-50%);
    text-align:center;
}

.onlineName{
    display:inline-block;
    background:rgba(0,0,0,.65);
    padding:3px 7px;
    border-radius:7px;
    font-size:12px;
    white-space:nowrap;
    margin-bottom:3px;
}

.onlineBody{
    width:60px;
    height:85px;
    margin:auto;
}

.onlineHead{
    width:30px;
    height:30px;
    margin:auto;
    border-radius:50%;
    background:#ffd2a6;
}

.onlineShirt{
    width:40px;
    height:45px;
    margin:2px auto;
    border-radius:10px;
}

/* ================================
   UI
================================ */

.topUI{
    position:absolute;
    z-index:50;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    pointer-events:none;
}

.topLeft,
.topRight{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    pointer-events:auto;
}

.uiBox{
    background:rgba(0,0,0,.58);
    padding:10px 13px;
    border-radius:12px;
    font-weight:bold;
    backdrop-filter:blur(5px);
}

.uiBtn{
    padding:10px 13px;
    border-radius:11px;
    color:white;
    background:rgba(0,0,0,.62);
    font-weight:bold;
}

.uiBtn:hover{
    background:rgba(0,0,0,.85);
}

.publicNotice{
    position:absolute;
    z-index:45;
    top:95px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 15px;
    border-radius:20px;
    background:rgba(0,0,0,.52);
    font-size:13px;
    text-align:center;
}

/* ================================
   낚시
================================ */

.fishingPanel{
    position:absolute;
    z-index:60;
    left:50%;
    transform:translateX(-50%);
    bottom:25px;
    width:min(92vw,650px);
    text-align:center;
}

.fishingMessage{
    min-height:50px;
    font-size:clamp(18px,4vw,27px);
    font-weight:900;
    text-shadow:0 2px 4px #000;
    margin-bottom:10px;
}

.fishingBtn{
    padding:15px 35px;
    border-radius:15px;
    font-size:21px;
    font-weight:900;
    background:#ffbd2e;
    color:#222;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.fishingBtn:active{
    transform:scale(.96);
}

.gaugeWrap{
    display:none;
    width:100%;
    height:38px;
    background:#202020;
    border:3px solid white;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:12px;
}

.gauge{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#00e676,#ffff00,#ff3d00);
}

/* ================================
   팝업
================================ */

.catchPopup{
    position:absolute;
    z-index:200;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%) scale(.5);
    opacity:0;
    pointer-events:none;
    text-align:center;
    transition:.3s;
}

.catchPopup.show{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
}

.catchBig{
    font-size:80px;
}

.catchTitle{
    font-size:34px;
    font-weight:900;
    text-shadow:0 4px 10px #000;
}

.catchSub{
    font-size:19px;
    margin-top:8px;
}

/* ================================
   모달
================================ */

.modal{
    position:absolute;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    padding:15px;
}

.modal.show{
    display:flex;
}

.modalBox{
    width:min(95vw,1000px);
    max-height:92vh;
    overflow:auto;
    background:#102131;
    border:2px solid #40647e;
    border-radius:20px;
    padding:20px;
}

.modalHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.modalHeader h2{
    margin:0;
}

.closeBtn{
    padding:10px 14px;
    background:#e74c3c;
    color:white;
    border-radius:10px;
    font-weight:bold;
}

/* ================================
   도감
================================ */

.tabs{
    display:flex;
    gap:7px;
    overflow:auto;
    margin-bottom:15px;
}

.tab{
    flex:0 0 auto;
    padding:10px 14px;
    border-radius:10px;
    background:#233d50;
    color:white;
}

.tab.active{
    background:#267cff;
}

.codexGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
    gap:9px;
}

.codexCard{
    min-height:145px;
    border-radius:13px;
    background:#1c3344;
    padding:10px;
    text-align:center;
    border:1px solid #31556d;
}

.codexCard.unknown{
    background:#10171d;
}

.fishEmoji{
    font-size:38px;
    margin:5px;
}

.fishName{
    font-weight:900;
    margin-bottom:4px;
}

.fishRarity{
    font-size:12px;
}

.fishTrait{
    font-size:13px;
    margin-top:4px;
}

.fishPrice{
    color:#ffd54f;
    font-size:12px;
    margin-top:5px;
}

/* ================================
   인벤토리 / 판매
================================ */

.inventoryGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:10px;
}

.inventoryCard{
    background:#1a3344;
    padding:12px;
    border-radius:13px;
}

.sellBtn{
    margin-top:8px;
    width:100%;
    padding:9px;
    border-radius:9px;
    background:#e6a928;
    font-weight:bold;
}

/* ================================
   상점
================================ */

.rodList{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:10px;
}

.rodCard{
    background:#1a3344;
    border-radius:13px;
    padding:15px;
}

.rodCard.current{
    border:2px solid #00e676;
}

.buyRod{
    width:100%;
    margin-top:10px;
    padding:10px;
    background:#20b56b;
    color:white;
    border-radius:9px;
    font-weight:bold;
}

/* ================================
   저장
================================ */

.saveInput{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:0;
    margin-bottom:10px;
    font-size:17px;
}

.saveAction{
    width:100%;
    padding:13px;
    border-radius:10px;
    background:#267cff;
    color:white;
    font-weight:bold;
    margin-bottom:15px;
}

.saveItem{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    background:#1b3447;
    padding:10px;
    border-radius:10px;
    margin-bottom:8px;
}

.saveButtons{
    display:flex;
    gap:5px;
}

.saveButtons button{
    padding:8px;
    border-radius:8px;
    color:white;
    font-weight:bold;
}

.loadBtn{
    background:#2980ff;
}

.deleteBtn{
    background:#e74c3c;
}

/* ================================
   모바일
================================ */

@media(max-width:700px){

    .dock{
        width:48%;
        min-width:170px;
    }

    .player{
        left:23%;
        transform:scale(.8);
        transform-origin:top left;
    }

    .topUI{
        top:5px;
        left:5px;
        right:5px;
    }

    .uiBox,
    .uiBtn{
        padding:7px 9px;
        font-size:12px;
    }

    .publicNotice{
        top:82px;
        width:92%;
    }

    .fishingPanel{
        bottom:15px;
    }

    .fishingBtn{
        width:100%;
    }

    .codexGrid{
        grid-template-columns:repeat(2,1fr);
    }

    .inventoryGrid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div id="game">

<!-- ================================
     서버 선택
================================ -->

<div id="serverScreen" class="screen active">

    <div class="serverBox">

        <div class="serverTitle">
            🎣 낚시 게임
        </div>

        <div class="serverSub">
            서버를 선택하세요
        </div>

        <div class="serverButtons">

            <button
                class="serverBtn privateBtn"
                onclick="choosePrivate()"
            >
                🔒 개인 서버
                <div style="font-size:14px;margin-top:8px;opacity:.8">
                    혼자 플레이
                </div>
            </button>

            <button
                class="serverBtn publicBtn"
                onclick="choosePublic()"
            >
                🌐 공용 서버
                <div style="font-size:14px;margin-top:8px;opacity:.8">
                    다른 사람들과 플레이
                </div>
            </button>

        </div>

        <div class="serverInfo">
            개인 서버와 공용 서버 모두 낚시 가능<br>
            공용 서버에서는 다른 플레이어와 도감을 공유합니다.
        </div>

    </div>

</div>


<!-- ================================
     닉네임
================================ -->

<div id="nicknameScreen" class="screen">

    <div class="nicknameBox">

        <h2>🌐 공용 서버</h2>

        <p>
            게임에서 사용할 닉네임을 입력하세요.
        </p>

        <input
            id="nicknameInput"
            class="nicknameInput"
            maxlength="12"
            placeholder="닉네임"
        >

        <button
            class="startPublic"
            onclick="startPublicServer()"
        >
            공용 서버 입장
        </button>

        <button
            onclick="backToServerSelect()"
            style="
                margin-top:10px;
                width:100%;
                padding:12px;
                border-radius:10px;
            "
        >
            뒤로가기
        </button>

    </div>

</div>


<!-- ================================
     게임
================================ -->

<div id="gameScreen" class="screen">

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <div class="water"></div>

    <div class="dock"></div>


    <!-- 내 캐릭터 -->

    <div id="myPlayer" class="player">

        <div class="playerHead"></div>

        <div
            id="myPlayerBody"
            class="playerBody"
        ></div>

        <div class="playerLegs">
            <span></span>
            <span></span>
        </div>

        <div class="rodVisual"></div>

        <div class="lineVisual"></div>

    </div>


    <!-- 다른 플레이어 -->

    <div
        id="publicPlayers"
        class="publicPlayers"
    ></div>


    <!-- 상단 UI -->

    <div class="topUI">

        <div class="topLeft">

            <div class="uiBox">
                💰
                <span id="moneyText">0</span>G
            </div>

            <div class="uiBox">
                🎣
                <span id="rodText">
                    나뭇가지 낚싯대
                </span>
            </div>

            <button
                class="uiBtn"
                onclick="openCodex()"
            >
                📖 도감
            </button>

            <button
                class="uiBtn"
                onclick="openInventory()"
            >
                🎒 물고기
            </button>

        </div>


        <div class="topRight">

            <button
                class="uiBtn"
                onclick="openRodShop()"
            >
                🏪 낚싯대
            </button>

            <button
                class="uiBtn"
                onclick="openSell()"
            >
                💰 판매
            </button>

            <button
                id="saveButton"
                class="uiBtn"
                onclick="openSaveModal()"
            >
                💾 저장
            </button>

            <button
                id="loadButton"
                class="uiBtn"
                onclick="openLoadModal()"
            >
                📂 불러오기
            </button>

            <button
                class="uiBtn"
                onclick="backToServerSelect()"
            >
                🚪 나가기
            </button>

        </div>

    </div>


    <div
        id="publicNotice"
        class="publicNotice"
        style="display:none"
    >
        🌐 공용 서버 · A/D 이동 · 클릭/Enter 낚시 · 도감 공유
    </div>


    <!-- 낚시 -->

    <div class="fishingPanel">

        <div
            id="fishingMessage"
            class="fishingMessage"
        >
            🎣 낚시를 시작하세요!
        </div>

        <div
            id="gaugeWrap"
            class="gaugeWrap"
        >
            <div
                id="gauge"
                class="gauge"
            ></div>
        </div>

        <button
            id="fishingButton"
            class="fishingBtn"
            onclick="fishingAction()"
        >
            🎣 낚시하기
        </button>

    </div>


    <!-- 물고기 획득 -->

    <div
        id="catchPopup"
        class="catchPopup"
    >

        <div
            id="catchBig"
            class="catchBig"
        >
            🐟
        </div>

        <div
            id="catchTitle"
            class="catchTitle"
        >
            물고기 획득!
        </div>

        <div
            id="catchSub"
            class="catchSub"
        ></div>

    </div>

</div>


<!-- ================================
     도감
================================ -->

<div id="codexModal" class="modal">

    <div class="modalBox">

        <div class="modalHeader">

            <h2>
                📖 물고기 도감
            </h2>

            <button
                class="closeBtn"
                onclick="closeModal('codexModal')"
            >
                닫기
            </button>

        </div>


        <div class="tabs">

            <button
                class="tab active"
                onclick="setCodexTab('all',this)"
            >
                📖 전체
            </button>

            <button
                class="tab"
                onclick="setCodexTab('normal',this)"
            >
                🐟 기본
            </button>

            <button
                class="tab"
                onclick="setCodexTab('different',this)"
            >
                🎨 색이 다른
            </button>

            <button
                class="tab"
                onclick="setCodexTab('shiny',this)"
            >
                ✨ 빛나는
            </button>

            <button
                class="tab"
                onclick="setCodexTab('rainbow',this)"
            >
                🌈 무지개
            </button>

        </div>


        <div id="codexCount"></div>

        <br>

        <div
            id="codexGrid"
            class="codexGrid"
        ></div>

    </div>

</div>


<!-- ================================
     인벤토리
================================ -->

<div id="inventoryModal" class="modal">

    <div class="modalBox">

        <div class="modalHeader">

            <h2>
                🎒 물고기
            </h2>

            <button
                class="closeBtn"
                onclick="closeModal('inventoryModal')"
            >
                닫기
            </button>

        </div>

        <div
            id="inventoryGrid"
            class="inventoryGrid"
        ></div>

    </div>

</div>


<!-- ================================
     낚싯대 상점
================================ -->

<div id="rodModal" class="modal">

    <div class="modalBox">

        <div class="modalHeader">

            <h2>
                🏪 낚싯대 상점
            </h2>

            <button
                class="closeBtn"
                onclick="closeModal('rodModal')"
            >
                닫기
            </button>

        </div>

        <div
            id="rodList"
            class="rodList"
        ></div>

    </div>

</div>


<!-- ================================
     판매
================================ -->

<div id="sellModal" class="modal">

    <div class="modalBox">

function startFishing(){

}


function increaseGauge(){

    if(fishingState !== "catching")
        return;


    const rod =
        rods[currentRod];


    gaugeValue +=
        8 * rod.power;


    if(gaugeValue > 100)
        gaugeValue = 100;


    document
    .getElementById("gauge")
    .style.width =
        gaugeValue + "%";


    if(gaugeValue >= 100){

        catchFish();

    }

}


/* =====================================================
   물고기 선택
===================================================== */

function chooseFish(){

    const luck =
        rods[currentRod].luck;


    const weights = [

        40,

        15,

        5*(1+luck/100),

        1.5*(1+luck/70),

        .3*(1+luck/55),

        .03*(1+luck/40)

    ];


    let total =
        weights.reduce(
            (a,b)=>a+b,
            0
        );


    let r =
        Math.random()*total;


    let rarity = 0;


    for(let i=0;i<weights.length;i++){

        r -= weights[i];

        if(r <= 0){

            rarity = i;

            break;

        }

    }


    const possible =
        fishList.filter(
            fish=>fish.rarity===rarity
        );


    return possible[
        Math.floor(
            Math.random()*possible.length
        )
    ];

}


function chooseTrait(){

    const r =
        Math.random()*100;


    if(r < .1)
        return "rainbow";


    if(r < 1)
        return "shiny";


    if(r < 6)
        return "different";


    return "normal";

}

async function catchFish(){

    if(fishingState !== "catching")
        return;


    fishingState = "idle";


    clearTimeout(fishingTimer);


    document
    .getElementById("gaugeWrap")
    .style.display = "none";


    document
    .getElementById("fishingButton")
    .textContent =
        "🎣 낚시하기";


    document
    .getElementById("fishingMessage")
    .textContent =
        "🎣 낚시를 시작하세요!";


    const fish =
        chooseFish();


    const traitKey =
        chooseTrait();


    const key =
        fish.id +
        "|" +
        traitKey;


    /*
     * 중요:
     * 개인 서버든 공용 서버든
     * 잡은 물고기는 자기 인벤토리에 들어감
     */

    inventory[key] =
        (inventory[key] || 0) + 1;


    /*
     * 자기 도감도 기록
     */

    privateCodex[key] = true;


    /*
     * 공용 서버라면
     * 공유 도감에도 기록
     */

    if(serverMode === "public"){

        await addPublicCodex(key);

    }


    /*
     * 개인 서버라면 자동 저장
     */

    if(serverMode === "private"){

        saveAutoSave();

    }


    updateUI();

    showCatchPopup(
        fish,
        traitKey
    );

}

function isDiscovered(
    fish,
    traitKey
){

    const key =
        fish.id +
        "|" +
        traitKey;


    /*
     * 공용 서버:
     * 공용 도감 + 내가 직접 잡은 도감
     */

    if(serverMode === "public"){

        return !!(
            publicCodex[
                encodeURIComponent(key)

            privateCodex[key]
        );

    }


    return !!privateCodex[key];

}


function renderCodex(){

    const grid =
        document.getElementById(
            "codexGrid"
        );


    grid.innerHTML = "";


    let entries = [];


    fishList.forEach(fish=>{

        traitOrder.forEach(traitKey=>{

            if(
                currentCodexTab !== "all" &&
                currentCodexTab !== traitKey
            )
                return;


            entries.push({
                fish,
                traitKey
            });

        });

    });


    let discovered = 0;


    entries.forEach(
        ({fish,traitKey})=>{

            const found =
                isDiscovered(
                    fish,
                    traitKey
                );


            if(found)
                discovered++;


            const trait =
                traits[traitKey];


            const card =
                document.createElement("div");


            card.className =
                "codexCard" +
                (found ? "" : " unknown");


            if(found){

                const price =
                    Math.floor(
                        fish.price *
                        trait.multiplier
                    );


                card.innerHTML = `

                    <div class="fishEmoji">
                        ${trait.emoji}${fish.emoji}
                    </div>

                    <div class="fishName">
                        ${fish.name}
                    </div>

                    <div
                        class="fishRarity"
                        style="color:${
                            rarityData[
                                fish.rarity
                            ].color
                        }"
                    >
                        ${
                            rarityData[
                                fish.rarity
                            ].name
                        }
                    </div>

                    <div class="fishTrait">
                        ${trait.name}
                    </div>

                    <div class="fishPrice">
                        ${price.toLocaleString()}G
                    </div>

                `;

            }else{

                card.innerHTML = `

                    <div class="fishEmoji">
                        ❓
                    </div>

                    <div class="fishName">
                        ???
                    </div>

                    <div
                        class="fishRarity"
                        style="color:${
                            rarityData[
                                fish.rarity
                            ].color
                        }"
                    >
                        ${
                            rarityData[
                                fish.rarity
                            ].name
                        }
                    </div>

                    <div class="fishTrait">
                        ${trait.emoji}
                        ${trait.name}
                    </div>

                `;

            }


            grid.appendChild(card);

        }
    );


    document
    .getElementById("codexCount")
    .textContent =
        `${discovered} / ${entries.length} 발견`;

}

window.sellFish = function(key){

    if(!inventory[key])
        return;


    const [
        fishId,
        traitKey
    ] =
        key.split("|");


    const fish =
        fishList[
            Number(fishId)
        ];


    const trait =
        traits[traitKey];


    const price =
        Math.floor(
            fish.price *
            trait.multiplier
        );


    inventory[key]--;

    money += price;


    if(inventory[key] <= 0){

        delete inventory[key];

    }


    /*
     * 개인/공용 서버 모두
     * 자기 데이터로 처리
     */

    if(serverMode === "private"){

        saveAutoSave();

    }


    updateUI();

    renderSell();

};

window.openRodShop = function(){

    document
    .getElementById("rodModal")
    .classList
    .add("show");


    renderRodShop();

};


function renderRodShop(){

    const list =
        document.getElementById(
            "rodList"
        );


    list.innerHTML = "";


    rods.forEach((rod,index)=>{

        const card =
            document.createElement("div");


        card.className =
            "rodCard" +
            (
                index === currentRod
                ? " current"
                : ""
            );


        let button = "";


        if(index === currentRod){

            button = `
                <button
                    class="buyRod"
                    disabled
                    style="opacity:.6"
                >
                    현재 장착 중
                </button>
            `;

        }
        else if(index === currentRod+1){

            button = `

                <button
                    class="buyRod"
                    onclick="buyRod(${index})"
                >
                    ${rod.price.toLocaleString()}G 구매
                </button>

            `;

        }
        else if(index < currentRod){

            button = `
                <button
                    class="buyRod"
                    disabled
                    style="opacity:.5"
                >
                    구매 완료
                </button>
            `;

        }
        else{

            button = `
                <button
                    class="buyRod"
                    disabled
                    style="opacity:.4"
                >
                    이전 낚싯대 필요
                </button>
            `;

        }


        card.innerHTML = `

            <h3>
                ${rod.name}
            </h3>

            <div>
                🍀 행운 +${rod.luck}
            </div>

            <div>
                ⚡ 게이지 ×${rod.power}
            </div>

            <div>
                🏃 속도 ×${rod.speed}
            </div>

            <div style="margin-top:8px">
                가격 :
                ${rod.price.toLocaleString()}G
            </div>

            ${button}

        `;


        list.appendChild(card);

    });

}


window.buyRod = function(index){

    if(index !== currentRod+1)
        return;


    const rod =
        rods[index];


    if(money < rod.price){

        alert(
            "돈이 부족합니다.\n\n"+
            "필요한 돈: "+
            rod.price.toLocaleString()+
            "G"
        );

        return;

    }


    money -= rod.price;

    currentRod = index;


    if(serverMode === "private"){

        saveAutoSave();

    }


    updateUI();

    renderRodShop();


    alert(
        rod.name +
        "을(를) 구매했습니다!"
    );

};


/* =====================================================
   저장
===================================================== */

const SAVE_KEY =
    "fishing_save_slots";


const AUTO_KEY =
    "fishing_auto_save";


function getSaveSlots(){

    try{

        return JSON.parse(
            localStorage.getItem(
                SAVE_KEY
            ) || "{}"
        );

    }catch(e){

        return {};

    }

}


function saveCurrentData(){

    return {

        money:money,

        currentRod:currentRod,

        inventory:inventory,

        privateCodex:privateCodex,

        savedAt:
            new Date().toLocaleString()

    };

}


function saveAutoSave(){

    if(serverMode !== "private")
        return;


    localStorage.setItem(
        AUTO_KEY,
        JSON.stringify(
            saveCurrentData()
        )
    );

}


function loadAutoSave(){

    try{

        const raw =
            localStorage.getItem(
                AUTO_KEY
            );


        if(!raw){

            money = 0;

            currentRod = 0;

            inventory = {};

            privateCodex = {};

            return;

        }


        applySaveData(
            JSON.parse(raw)
        );

    }catch(e){

        console.error(e);

    }

}


function applySaveData(data){

    money =
        Number(data.money) || 0;


    currentRod =
        Number(data.currentRod) || 0;


    if(
        currentRod < 0 ||
        currentRod >= rods.length
    ){

        currentRod = 0;

    }


    inventory =
        data.inventory || {};


    privateCodex =
        data.privateCodex ||
        data.discovered ||
        {};


    updateUI();

}

===================================================== */

window.openSaveModal = function(){

    if(serverMode !== "private")
        return;


    document
    .getElementById("saveModal")
    .classList
    .add("show");


    renderSaveList();

};


window.saveNamedGame = function(){

    const input =
        document.getElementById(
            "saveNameInput"
        );


    const name =
        input.value.trim();


    if(!name){

        alert(
            "저장 이름을 입력해주세요."
        );

        return;

    }


    const saves =
        getSaveSlots();


    saves[name] =
        saveCurrentData();


    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(saves)
    );


    input.value = "";


    renderSaveList();


    alert(
        `"${name}" 저장 완료!`
    );

};


function renderSaveList(){

    const box =
        document.getElementById(
            "saveList"
        );


    box.innerHTML = "";


    const saves =
        getSaveSlots();


    const names =
        Object.keys(saves);


    if(names.length === 0){

        box.innerHTML =
            "<p>저장된 게임이 없습니다.</p>";

        return;

    }


    names.forEach(name=>{

        const data =
            saves[name];


        const item =
            document.createElement("div");


        item.className =
            "saveItem";


        item.innerHTML = `

            <div>
                <b>
                    ${escapeHTML(name)}
                </b>

                <br>

                <small>
                    💰
                    ${Number(
                        data.money || 0
                    ).toLocaleString()}G
                    ·
                    ${escapeHTML(
                        data.savedAt || ""
                    )}
                </small>
            </div>

            <div class="saveButtons">

                <button
                    class="loadBtn"
                    onclick="loadSaveByName(${JSON.stringify(name)})"
                >
                    불러오기
                </button>

                <button
                    class="deleteBtn"
                    onclick="deleteSaveByName(${JSON.stringify(name)})"
                >
                    🗑️ 삭제
                </button>

            </div>

        `;


        box.appendChild(item);

    });

}


window.loadSaveByName = function(name){

    const saves =
        getSaveSlots();


    if(!saves[name]){

        alert(
            "저장 데이터를 찾을 수 없습니다."
        );

        return;

    }


    applySaveData(
        saves[name]
    );


    saveAutoSave();


    closeModal("saveModal");


    alert(
        `"${name}" 불러오기 완료!`
    );

};


window.deleteSaveByName = function(name){

    if(
        !confirm(
            `"${name}" 저장을 삭제할까요?`
        )
    )
        return;


    const saves =
        getSaveSlots();


    delete saves[name];


    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(saves)
    );


    renderSaveList();

};
